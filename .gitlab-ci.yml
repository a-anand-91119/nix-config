---
image: nixos/nix:latest

workflow:
  rules:
    - if: $CI_SERVER_URL == "https://gitlab.notyouraverage.dev"
      when: always
    - when: never

stages:
  - lint
  - check

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

lint:
  stage: lint
  script:
    - bash scripts/test.sh --syntax-only
    - nix shell --inputs-from . nixpkgs#nixpkgs-fmt --command bash -c 'git ls-files -z -- "*.nix" | xargs -0 nixpkgs-fmt --check'
    - nix shell --inputs-from . nixpkgs#statix --command statix check

evaluate-profiles:
  stage: check
  script:
    - bash scripts/test.sh --eval-only
    - nix shell --inputs-from . nixpkgs#python3 --command python3 tests/test-validation.py
  # Linux evaluates the Darwin derivations; actual builds require a Mac.
  # Failures are not hidden with allow_failure or an unconditional fallback.
